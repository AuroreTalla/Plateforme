app = "plateforme-backend"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_PORT = "8081"
  SPRING_PROFILES_ACTIVE = "prod"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/actuator/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512