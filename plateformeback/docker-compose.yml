services:
  mariadb:
    image: mariadb:10.11
    container_name: plateforme_mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: plateformeBD
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
