# ===============================
# 🚀 CONFIGURATION GÉNÉRALE
# ===============================
spring.application.name=plateformeBD
server.address=0.0.0.0
server.port=8081

# ===============================
# 🗄️ CONNEXION MARIA DB
# ===============================
spring.datasource.url="jdbc:mariadb://plateforme-db.internal:3306/plateformeBD"
spring.datasource.username=plateforme
spring.datasource.password=UserPassword456!
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Pool de connexions optimisé
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# 🔧 HIBERNATE / JPA
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optimisations Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# 📊 ACTUATOR (healthcheck Fly.io)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.endpoint.health.probes.enabled=true

# ===============================
# 🌐 FRONTEND / CORS
# ===============================
app.frontend.url=${FRONTEND_URL:https://plateforme-frontend.onrender.com}
spring.web.cors.allowed-origins=${FRONTEND_URL:https://plateforme-frontend.onrender.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type
spring.web.cors.allow-credentials=true

# ===============================
# 🔐 JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:1800000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:604800000}

# ===============================
# 📧 EMAIL
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}

# ===============================
# 🔒 SÉCURITÉ
# ===============================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ===============================
# 📝 LOGGING
# ===============================
logging.level.root=WARN
logging.level.com.votre.package=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# ⚡ PERFORMANCES
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ===============================
# 🔧 UPLOADS
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

