# ===============================
# PRODUCTION - RENDER + TIDB CLOUD
# ===============================
spring.application.name=plateformeBD
server.port=${PORT:8081}

# ===============================
# BASE DE DONNÉES (TiDB Cloud)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions (petit pour free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===============================
# HIBERNATE / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:1800000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:604800000}

# ===============================
# COOKIES (Cross-domain HTTPS)
# ===============================
app.cookie.secure=true
app.cookie.samesite=None

# ===============================
# CORS
# ===============================
app.frontend.url=${FRONTEND_URL}

# ===============================
# ACTUATOR (Health check pour Render)
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.mail=DEBUG

# ===============================
# EMAIL (Brevo API)
# ===============================
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=noreplyprepasconcours@gmail.com
brevo.sender.name=Prepas Concours