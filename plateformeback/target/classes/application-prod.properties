# ===============================
# 🚀 CONFIGURATION PRODUCTION
# ===============================
spring.application.name=plateformeBD
server.port=8081

# ===============================
# 🗄️ CONNEXION MARIA DB
# ===============================
# Les valeurs viennent des variables d'environnement Docker
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Pool de connexions optimisé pour production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# 🔧 HIBERNATE / JPA
# ===============================
# IMPORTANT: validate en prod (pas de modification auto de la DB)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Optimisations Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# 📧 EMAIL (MailHog ou SMTP)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}

# ===============================
# 🔐 JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:1800000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:604800000}

# ===============================
# 🍪 COOKIES CONFIGURATION
# ===============================
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.samesite=${APP_COOKIE_SAMESITE:None}

# ===============================
# 🌐 CORS CONFIGURATION
# ===============================
# URL du frontend autorisée
app.frontend.url=${FRONTEND_URL:http://localhost}

# ===============================
# 🔒 SÉCURITÉ
# ===============================
# Ne pas exposer les erreurs détaillées
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ===============================
# 📊 ACTUATOR (pour healthcheck)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ===============================
# 📝 LOGGING
# ===============================
logging.level.root=WARN
logging.level.com.votre.package=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Pattern de log structuré
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# ⚡ PERFORMANCES
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ===============================
# 🔧 AUTRES
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB