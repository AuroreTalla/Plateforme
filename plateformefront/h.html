<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test WebSocket - Plateforme</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        #messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 20px; }
        .message { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .message-header { font-weight: bold; color: #333; }
        .message-time { font-size: 0.8em; color: #666; }
        input[type="text"] { width: 70%; padding: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>💬 Test WebSocket - Messages</h1>
    
    <div id="status" class="disconnected">🔴 Déconnecté</div>
    
    <div>
        <label>Groupe : </label>
        <select id="groupeSelect">
            <option value="milk">milk</option>
            <option value="Physique">Physique</option>
            <option value="Chimie">Chimie</option>
        </select>
        <button onclick="connectWebSocket()">Se connecter</button>
        <button onclick="disconnect()">Se déconnecter</button>
    </div>

    <h3>Messages :</h3>
    <div id="messages"></div>

    <div>
        <input type="text" id="messageInput" placeholder="Tapez votre message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

    <script>
        let stompClient = null;
        let currentGroupe = null;

        function connectWebSocket() {
            const groupe = document.getElementById('groupeSelect').value;
            currentGroupe = groupe;

            const socket = new SockJS('http://localhost:8081/ws');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function(frame) {
                console.log('Connecté: ' + frame);
                document.getElementById('status').textContent = '🟢 Connecté au groupe: ' + groupe;
                document.getElementById('status').className = 'connected';

                // S'abonner aux messages du groupe
                stompClient.subscribe('/topic/groupe/' + groupe, function(message) {
                    const msg = JSON.parse(message.body);
                    showMessage(msg);
                });

                // Charger l'historique
                loadHistory(groupe);
            }, function(error) {
                console.error('Erreur de connexion:', error);
                document.getElementById('status').textContent = '🔴 Erreur de connexion';
                document.getElementById('status').className = 'disconnected';
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            document.getElementById('status').textContent = '🔴 Déconnecté';
            document.getElementById('status').className = 'disconnected';
            console.log('Déconnecté');
        }

        function sendMessage() {
            const messageContent = document.getElementById('messageInput').value.trim();
            
            if (!messageContent) {
                alert('Le message ne peut pas être vide !');
                return;
            }

            if (stompClient === null || !stompClient.connected) {
                alert('Vous devez vous connecter d\'abord !');
                return;
            }

            const message = {
                content: messageContent
            };

            stompClient.send("/app/sendMessage/" + currentGroupe, {}, JSON.stringify(message));
            document.getElementById('messageInput').value = '';
        }

        function showMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            
            messageElement.innerHTML = `
                <div class="message-header">${msg.user.name}</div>
                <div>${msg.content}</div>
                <div class="message-time">${msg.dateEnvoie}</div>
            `;
            
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function loadHistory(groupe) {
            fetch(`http://localhost:8081/groupes/${groupe}/messages?page=0&size=50`, {
                credentials: 'include'
            })
            .then(response => response.json())
            .then(messages => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                messages.forEach(msg => showMessage(msg));
            })
            .catch(error => console.error('Erreur chargement historique:', error));
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Auto-connexion au chargement
        window.onload = function() {
            // Optionnel : se connecter automatiquement
            // connectWebSocket();
        };
    </script>
</body>
</html>
